<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SSAFY Login Test</title>
</head>
<body>
<h1>🔐 SSAFY OAuth 로그인 테스트</h1>
<button onclick="login()">SSAFY 로그인</button>
<pre id="result"></pre>

<script>
    async function login() {
        // Spring Security 기본 엔드포인트
        window.location.href = "/oauth2/authorization/ssafy";
    }

    // 로그인 후 쿠키에 JWT가 있으면 자동 확인
    window.onload = async () => {
        try {
            const res = await fetch("/api/v1/users/me");
            const json = await res.json();
            document.getElementById("result").textContent = JSON.stringify(json, null, 2);
        } catch (e) {
            document.getElementById("result").textContent = "로그인 상태 확인 실패";
        }
    };
</script>
</body>
</html>
